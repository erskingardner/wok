# Wok configuration: a starting point for a public relay.
#
# Set only what this relay needs. Every setting left out comes from the
# preset, so the relay gets improved defaults when you upgrade. A setting in
# this file keeps its value, even one equal to today's default.
#
# docs/config.md describes every setting. `wok config show` prints the value
# of each and where it comes from, `wok config show --defaults` the preset's
# values, and `wok config minimize` removes settings that repeat them.

# The preset this file overlays. "public", the default, suits a general
# public relay.
preset = "public"

[relay]
# Wok listens on 127.0.0.1:7777 by default, for a TLS-terminating reverse
# proxy on the same host. If the proxy runs elsewhere, bind to a firewalled
# private address.
# bind = "127.0.0.1"
# port = 7777

# The header in which the proxy passes the client's address. Wok reads its
# last entry, which the proxy writes. Set it only if every connection comes
# through that proxy: a client that reaches the relay directly could send a
# new address each time and escape every per-address rate limit.
# real_ip_header = "x-real-ip"

[relay.auth]
# The relay's public URL, exactly as clients open it: NIP-42 AUTH events must
# name it. Until it is set, AUTH is unavailable, so DMs and gift wraps cannot
# be read. Set it before the first start.
# service_url = "wss://relay.example.com"

[relay.info]
# Shown to clients in NIP-11 and on the landing page.
# name = "Example relay"
# description = "A public Nostr relay."
# contact = "mailto:ops@example.com"

# Where the database lives. The default is ./wok-db/.
# [database]
# path = "/var/lib/wok/db"

# The operator dashboard at /admin; see docs/admin-dashboard.md.
# [admin]
# enabled = true
# public_url = "https://relay.example.com"
# pubkeys = ["npub1..."]
