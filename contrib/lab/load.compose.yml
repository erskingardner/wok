services:
  load:
    image: wok-lab:${LAB_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: contrib/lab/Dockerfile
      args:
        SOURCE_REVISION: ${LAB_SOURCE_REVISION:-unknown}
    entrypoint: [python3, /usr/local/lib/wok-lab/load.py]
    environment:
      LAB_TARGET: ${LAB_TARGET:-ws://relay:7777}
      LAB_EVENTS: ${LAB_EVENTS:-2000}
      LAB_PUBLISHERS: ${LAB_PUBLISHERS:-8}
      LAB_SUBSCRIBERS: ${LAB_SUBSCRIBERS:-8}
      LAB_FANOUT_EVENTS: ${LAB_FANOUT_EVENTS:-100}
      LAB_CONNECTIONS: ${LAB_CONNECTIONS:-64}
      LAB_HOLD_SECONDS: ${LAB_HOLD_SECONDS:-2}
      LAB_ROUNDS: ${LAB_ROUNDS:-1}
      LAB_SEED: ${LAB_SEED:-4242}
      LAB_BASE_TIMESTAMP: ${LAB_BASE_TIMESTAMP:-}
      LAB_DEADLINE_SECONDS: ${LAB_DEADLINE_SECONDS:-900}
    volumes:
      - load-results:/results
    cpus: ${LAB_LOAD_CPUS:-2}
    mem_limit: ${LAB_LOAD_MEMORY:-2g}
    memswap_limit: ${LAB_LOAD_MEMORY:-2g}
    pids_limit: 256
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
volumes:
  load-results:
