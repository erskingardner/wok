[package]
name = "wok-query"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Nostr filters, index selection, and resumable scans"

[features]
# Build-only author read-plan experiment; both RocksDB indexes remain written.
rocksdb-thin-author-reads = ["wok-db/rocksdb-backend"]
# Build-only operation counters for focused native read diagnostics.
rocksdb-read-diagnostics = ["wok-db/rocksdb-read-diagnostics"]
# Separate layout experiment; keep the same thin read plan as the dual-index control.
rocksdb-coverless = ["rocksdb-thin-author-reads", "wok-db/rocksdb-coverless"]

[dependencies]
serde_json.workspace = true
thiserror.workspace = true
wok-db = { path = "../wok-db" }
wok-event = { path = "../wok-event" }
lmdb-sys.workspace = true

[dev-dependencies]
proptest.workspace = true
sha2.workspace = true
serde_json.workspace = true
tempfile.workspace = true
hex.workspace = true
secp256k1.workspace = true
rand.workspace = true
zstd.workspace = true
