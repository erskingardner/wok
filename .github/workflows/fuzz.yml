name: fuzz

on:
  pull_request:
    paths:
      - 'fuzz/**'
      - 'crates/wok-event/**'
      - 'crates/wok-negentropy/**'
      - 'crates/wok-relay/src/protocol.rs'
      - 'crates/wok-ws/src/frame.rs'
      - .github/workflows/fuzz.yml
  schedule:
    - cron: '43 3 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingress:
    name: ingress (address)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Run bounded ingress campaign
        run: |
          nightly_cargo="$(rustup which --toolchain nightly cargo)"
          nightly_rustc="$(rustup which --toolchain nightly rustc)"
          CARGO="$nightly_cargo" RUSTC="$nightly_rustc" \
            cargo fuzz run ingress --sanitizer address -- -runs=10000 -max_len=131072
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-reproducers
          path: fuzz/artifacts/ingress/
          if-no-files-found: ignore
          retention-days: 30
