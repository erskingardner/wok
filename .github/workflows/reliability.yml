name: reliability soak

on:
  push:
    branches: [master]
    paths: ['crates/**', 'vendor/**', 'scripts/reliability-soak.py', 'scripts/lab.py', 'scripts/lab-bootstrap-debian.sh', 'scripts/benchmark-*.sh', 'scripts/tests/**', 'contrib/lab/**', '.dockerignore', 'Cargo.toml', 'Cargo.lock', '.github/workflows/reliability.yml']
  pull_request:
    paths: ['crates/**', 'vendor/**', 'scripts/reliability-soak.py', 'scripts/lab.py', 'scripts/lab-bootstrap-debian.sh', 'scripts/benchmark-*.sh', 'scripts/tests/**', 'contrib/lab/**', '.dockerignore', 'Cargo.toml', 'Cargo.lock', '.github/workflows/reliability.yml']
  schedule:
    - cron: '23 2 * * 0'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Mixed workload duration (10-3600 seconds); weekly runs use 3600'
        default: '3600'
        required: true

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    name: mixed workload / ${{ matrix.backend }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        backend: [lmdb, rocksdb]
    env:
      SOAK_DURATION: ${{ github.event_name == 'schedule' && '3600' || inputs.seconds || '180' }}
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v6
      - name: RocksDB native compiler and libclang
        if: matrix.backend == 'rocksdb'
        run: sudo apt-get update && sudo apt-get install -y g++ clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build production relay and load driver
        run: |
          flags=()
          if [ '${{ matrix.backend }}' = rocksdb ]; then flags+=(--features rocksdb); fi
          cargo build --release --locked -p wok-cli --bin wok --target-dir target/relay-${{ matrix.backend }} "${flags[@]}"
          # The driver talks over WS/Unix; its own storage build does not select the relay backend.
          cargo build --release --locked -p wok-compat --example reliability_soak --target-dir target/soak-driver
      - name: Verify mixed workload, author feeds, bounded memory, restart and process-crash recovery
        run: |
          python3 scripts/reliability-soak.py --wok target/relay-${{ matrix.backend }}/release/wok \
            --driver target/soak-driver/release/examples/reliability_soak --backend '${{ matrix.backend }}' \
            --seconds "$SOAK_DURATION" --seed 4242 --out "$RUNNER_TEMP/wok-soak-${{ matrix.backend }}"
      - name: Preserve workload, results and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-soak-${{ matrix.backend }}-${{ github.sha }}
          path: ${{ runner.temp }}/wok-soak-${{ matrix.backend }}
          if-no-files-found: error
          retention-days: 30

  compose:
    name: portable Docker lab
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
      - name: Check result gates and artifact extraction
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck
          python3 -m unittest discover -s scripts/tests -v
          shellcheck scripts/lab-bootstrap-debian.sh scripts/benchmark-*.sh
      - name: Build and exercise both Compose services
        run: python3 scripts/lab.py local --run-id ci-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve lab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-lab-${{ github.sha }}
          path: bench-results/lab/
          if-no-files-found: error
          retention-days: 30
