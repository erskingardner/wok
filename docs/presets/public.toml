# Wok preset: public (the default)
#
# A general public relay that any client can read from and write to: feeds,
# outbox lookups, DMs and gift-wrap inboxes.
#
# The public preset is Wok's built-in defaults, so this overlay changes
# nothing. docs/config.md documents every setting, `wok config show
# --defaults` lists each with this preset's value, and `wok config show`
# prints the effective configuration with the origin of each value.
#
# Wok resolves configuration in three layers: the built-in defaults, then the
# selected preset's overlay, then the operator's file. Each layer replaces
# individual keys, not whole sections. An overlay contains only the keys its
# preset changes.
#
# Defaults chosen for real client traffic rather than inherited from strfry
# (https://github.com/erskingardner/wok/issues/97):
#
# - [events] reject_older_than_secs = 0: no lower bound on created_at (was
#   three years). Old profiles, lists and deletions can be rebroadcast, and a
#   bound set in the operator's file never applies to replaceable,
#   addressable, deletion or vanish events. AUTH and kind 21059 gift wraps
#   use the windows NIP-42 and NIP-59 call for.
# - [relay] max_req_filter_size = 262144: 256 KiB of filters per REQ (was
#   64 KiB), so an outbox client can fetch a 2,000-account follow list in one
#   request. max_filter_bytes_per_connection = 2097152 caps the filters of all
#   the subscriptions open on one connection, so the larger REQ cap does not
#   multiply live filter memory.
# - [events] max_num_tags = 5000 (was 2000): heavy users' follow, mute and
#   other lists fit.
# - [relay] max_filter_limit = 2000 (was 500), NIP-11 max_limit and
#   default_limit: directory batches and metadata fetches without a limit
#   are no longer cut at 500. max_total_events_per_req = 10000 (was 2000):
#   merged batches of filters are no longer cut at 2,000 in all.
#   max_tags_per_filter = 8 (was 3): comment, community and marketplace
#   queries that combine four or more tag letters are accepted.
# - [relay.abuse] max_stored_events = 0 (was 10000000): no global event
#   cap, whose cliff failed every write on a busy relay. database.map_size
#   and database.min_free_disk_bytes bound storage.
#   max_stored_events_per_pubkey = 1000000 (was 100000): active users and
#   bots keep posting.
