[package]
name = "wok-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wok command-line interface"
default-run = "wok"

[[bin]]
name = "wok"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
ctrlc.workspace = true
hex.workspace = true
notify.workspace = true
parking_lot.workspace = true
rand.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
zstd = { workspace = true, features = ["zdict_builder"] }
wok-db = { path = "../wok-db" }
wok-event = { path = "../wok-event" }
wok-negentropy = { path = "../wok-negentropy" }
wok-query = { path = "../wok-query" }
wok-relay = { path = "../wok-relay" }
wok-unix = { path = "../wok-unix" }
wok-ws = { path = "../wok-ws" }
tokio-tungstenite.workspace = true
futures-util = "0.3"

[dev-dependencies]
tempfile.workspace = true
