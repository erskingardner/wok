[package]
name = "wok-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Wok RocksDB storage and verified read-only LMDB migration"

[features]
# Log every committed write for replay on other engines (#257 item 12).
op-log = []
# Opt-in, synchronous read diagnostics. No hooks are compiled into ordinary builds.
rocksdb-read-diagnostics = []
# Opt-in native memory observations; no sampling hooks in ordinary builds.
rocksdb-memory-diagnostics = []

[dependencies]
rustix = { version = "1", features = ["fs"] }
tempfile.workspace = true
fs2 = "0.4"
rocksdb = { version = "=0.25.0", default-features = false, features = ["lz4", "zstd", "bindgen-runtime"] }
bumpalo = "3.20"
elsa = "1.11"
flatbuffers.workspace = true
libc.workspace = true
lmdb-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
wok-event = { path = "../wok-event" }
zstd.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
hex.workspace = true
secp256k1.workspace = true
rand.workspace = true
serde_json.workspace = true
