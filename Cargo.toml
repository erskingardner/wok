[workspace]
resolver = "2"
members = [
    "crates/wok-event",
    "crates/wok-db",
    "crates/wok-query",
    "crates/wok-negentropy",
    "crates/wok-relay",
    "crates/wok-ws",
    "crates/wok-unix",
    "crates/wok-cli",
    "crates/wok-bench",
    "crates/wok-compat",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/erskingardner/wok"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
crossbeam-channel = "0.5"
data-encoding = "2"
flate2 = "1"
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
lmdb-sys = "0.8"
notify = "7"
parking_lot = "0.12"
proptest = "1"
rand = "0.8"
regex = "1"
secp256k1 = { version = "0.30", features = ["global-context", "hashes", "rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
zstd = "0.13"
flatbuffers = "25"
tempfile = "3"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
ctrlc = "3"
nix = { version = "0.29", features = ["socket", "uio", "user", "fs", "signal"] }
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hdrhistogram = "7"
sysinfo = "0.33"
walkdir = "2"
criterion = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
lto = "thin"
