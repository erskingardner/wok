name: security

on:
  push:
    paths:
      - '**/Cargo.toml'
      - Cargo.lock
      - deny.toml
      - .github/workflows/security.yml
  pull_request:
    paths:
      - '**/Cargo.toml'
      - Cargo.lock
      - deny.toml
      - .github/workflows/security.yml
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: advisories, licenses, and sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
          arguments: --all-features
