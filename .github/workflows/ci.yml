name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: stable / RocksDB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: target/ci-native
      RUST_TEST_THREADS: '2'
    steps:
      - uses: actions/checkout@v6
      - name: RocksDB native build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace tests, including storage recovery, migration and author frontiers
        run: cargo test --workspace --locked
      - name: Script guards
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          python3 -m unittest discover -s scripts/tests -v

  migration:
    name: pinned strfry migration compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      WOK_REQUIRE_STRFRY: '1'
      STRFRY_BIN: ${{ github.workspace }}/.reference/strfry/strfry
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '2'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: hoytech/strfry
          ref: 9acdaeb1f63919184ece5f2dd67af21f1ed62f1b
          path: .reference/strfry
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Build pinned import reference
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ clang libclang-dev make libssl-dev zlib1g-dev liblmdb-dev libflatbuffers-dev libsecp256k1-dev libzstd-dev
          make -C .reference/strfry setup-golpe
          make -C .reference/strfry -j2
          test -x "$STRFRY_BIN"
      - name: Verify migration and event identity against C++
        run: |
          cargo test -p wok-db --test cpp_roundtrip --locked -- --nocapture
          cargo test -p wok-compat --test cpp_export --test cpp_negentropy --locked -- --nocapture
          cargo test -p wok-cli migrate::tests --locked
          cargo test -p wok-cli --test migration_cpp --locked

  msrv:
    name: rust 1.88 minimum version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: target/msrv
    steps:
      - uses: actions/checkout@v6
      - name: RocksDB native build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ clang libclang-dev
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Check workspace at declared MSRV
        run: |
          rustup run 1.88.0 rustc --version
          rustup run 1.88.0 cargo check --workspace --all-targets --locked
