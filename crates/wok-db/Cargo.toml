[package]
name = "wok-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Wok LMDB storage and verified strfry v3 migration"

[features]
# Log every committed write for replay on other engines (#257 item 12).
op-log = []
# Experimental full relay backend, isolated from the default LMDB build.
rocksdb-backend = ["dep:rocksdb", "dep:bumpalo", "dep:elsa", "dep:fs2"]

[dependencies]
fs2 = { version = "0.4", optional = true }
rocksdb = { version = "=0.25.0", optional = true, default-features = false, features = ["lz4", "zstd", "bindgen-runtime"] }
bumpalo = { version = "3.20", optional = true }
elsa = { version = "1.11", optional = true }
flatbuffers.workspace = true
libc.workspace = true
lmdb-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
wok-event = { path = "../wok-event" }
zstd.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
hex.workspace = true
secp256k1.workspace = true
rand.workspace = true
serde_json.workspace = true
