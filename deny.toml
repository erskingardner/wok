[advisories]
yanked = "deny"
ignore = [
    # Inherited through the pinned experimental FIPS client. None currently
    # has a compatible upstream upgrade; keep the exceptions exact and remove
    # them when FIPS advances its nostr/rtnetlink dependency graph.
    "RUSTSEC-2024-0384", # instant, unmaintained
    "RUSTSEC-2024-0436", # paste, unmaintained
    "RUSTSEC-2026-0243", # nostr-relay-pool, resource exhaustion
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "AGPL-3.0-or-later",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    # Transitive dependencies of the pinned native FIPS client. Keep these
    # scoped to the exact crates instead of widening the workspace allowlist.
    { allow = ["MPL-2.0"], crate = "option-ext" },
    { allow = ["GPL-3.0-or-later"], crate = "rustables" },
    { allow = ["GPL-3.0-or-later"], crate = "rustables-macros" },
    { allow = ["WTFPL"], crate = "tun" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/jmcorgan/fips.git"]
